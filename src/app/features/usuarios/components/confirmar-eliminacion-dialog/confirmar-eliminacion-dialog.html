<div class="confirm-dialog">

  <div class="confirm-dialog__content">

    <p class="confirm-dialog__message">
      ¿Está seguro de eliminar el usuario seleccionado?
    </p>

  </div>

  <div class="confirm-dialog__footer">

    <button
      mat-flat-button
      type="button"
      class="confirm-dialog__accept"
      (click)="aceptar()"
    >
      Aceptar
    </button>

    <button
      mat-button
      type="button"
      class="confirm-dialog__cancel"
      (click)="cancelar()"
    >
      Cancelar
    </button>

  </div>

</div>
